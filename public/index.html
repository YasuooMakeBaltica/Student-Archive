<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Archive — Democracy Craft</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>The Student Archive</h1>
    <p class="sub">Academic records &amp; case studies of Democracy Craft</p>
    <div id="account"></div>
    <nav>
      <button data-tab="records" class="active">Library Database</button>
      <button data-tab="cases">Case Study Finder</button>
    </nav>
  </header>

  <main>
    <section class="controls">
      <input id="search" type="search" placeholder="Search the archive…">
      <input id="tag" type="text" placeholder="Filter by tag">
    </section>

    <label id="hiddenToggle" hidden><input type="checkbox" id="showHidden"> Show hidden entries</label>

    <section id="results" aria-live="polite"></section>

    <details class="add">
      <summary>Add an entry</summary>
      <form id="form"></form>
    </details>
  </main>

  <footer>Democracy Craft Student Archive · MIT License</footer>
  <script src="app.js"></script>
</body>
</html>
