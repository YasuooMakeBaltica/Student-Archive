<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Archive — Democracy Craft</title>
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { if (localStorage.getItem('theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="account"></div>
  <header>
    <div class="title">
      <svg class="book" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
        <polygon points="20,3 37,20 20,37 3,20" fill="#fbf6ea"/>
        <polygon points="20,3 3,20 20,37" fill="#6b4a2b"/>
        <path d="M25 11.5l7.5 7.5M25 16l7.5 7.5M25 20.5l7.5 7.5" stroke="#b49f7c" stroke-width="1.2" stroke-linecap="round" fill="none"/>
        <line x1="20" y1="3" x2="20" y2="37" stroke="#3b2f20" stroke-width="1.5"/>
        <polygon points="20,3 37,20 20,37 3,20" fill="none" stroke="#3b2f20" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
      <h1>The Student Archive</h1>
      <svg class="book" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
        <polygon points="20,3 37,20 20,37 3,20" fill="#fbf6ea"/>
        <polygon points="20,3 3,20 20,37" fill="#6b4a2b"/>
        <path d="M25 11.5l7.5 7.5M25 16l7.5 7.5M25 20.5l7.5 7.5" stroke="#b49f7c" stroke-width="1.2" stroke-linecap="round" fill="none"/>
        <line x1="20" y1="3" x2="20" y2="37" stroke="#3b2f20" stroke-width="1.5"/>
        <polygon points="20,3 37,20 20,37 3,20" fill="none" stroke="#3b2f20" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
    </div>
    <p class="sub">Academic records &amp; case studies of Democracy Craft</p>
    <nav>
      <button data-tab="records" class="active">Library Database</button>
      <button data-tab="cases">Case Study Finder</button>
    </nav>
  </header>

  <main>
    <section class="controls" id="recordSearch">
      <input id="search" type="search" placeholder="Search the archive…">
      <input id="tag" type="text" placeholder="Filter by tag">
    </section>

    <section class="active-cases" id="activeCases" hidden>
      <h2>Active cases</h2>
      <div class="active-list" id="activeList"></div>
    </section>

    <div class="sync-panel" id="syncPanel" hidden>
      <span id="syncStatus">Forum sync</span>
      <button type="button" class="btn-plain" id="syncNow">Sync court forums now</button>
    </div>

    <form class="case-search" id="caseSearch" hidden>
      <label class="wide">Keywords <input name="q" type="search" placeholder="Facts, arguments, verdict…"></label>
      <label>Parties <input name="parties" placeholder="Plaintiff or defendant"></label>
      <label>Citation <input name="citation" placeholder="e.g. [2026] DCR 1"></label>
      <label>Law cited <input name="law" placeholder="e.g. Criminal Code Act"></label>
      <label>Court <select name="court"><option value="">Any court</option></select></label>
      <label>Case type <select name="caseType"><option value="">Any type</option></select></label>
      <label>Status <select name="status"><option value="">Any status</option></select></label>
      <label>Year from <input name="yearFrom" type="number" min="1000" max="9999" placeholder="e.g. 2024"></label>
      <label>Year to <input name="yearTo" type="number" min="1000" max="9999" placeholder="e.g. 2026"></label>
      <div class="case-search-actions">
        <span id="caseCount" aria-live="polite"></span>
        <button type="reset" class="btn-plain">Clear search</button>
      </div>
    </form>

    <section id="results" aria-live="polite"></section>
    <p class="more"><button type="button" class="btn-plain" id="loadMore" hidden>Show more</button></p>

    <details class="add" id="addBox" hidden>
      <summary>Add an entry</summary>
      <form id="form"></form>
    </details>
  </main>

  <footer>Democracy Craft Student Archive · <a href="terms.html">Terms of Service</a> · MIT License</footer>
  <script src="app.js"></script>
</body>
</html>
